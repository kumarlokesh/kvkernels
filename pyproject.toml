[project]
name = "kvkernels"
version = "0.0.0"
description = "Triton kernels for paged KV-cache movement and shared-prefix decode attention"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# torch and Triton are pinned exactly so that results stay comparable across runs.
# Triton publishes Linux wheels only.
dependencies = [
    "numpy>=1.26",
    "triton==3.8.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Pick exactly one torch build: cpu (devcontainer, CI, macOS) or a CUDA build (GPU machines).
cpu = ["torch==2.14.1"]
# cuda-bindings reaches the CUDA driver API for the batched-DMA benchmark baseline;
# its major version matches the torch build's CUDA.
cu126 = ["torch==2.14.1; sys_platform == 'linux'", "cuda-bindings==12.9.10; sys_platform == 'linux'"]
cu130 = ["torch==2.14.1; sys_platform == 'linux'", "cuda-bindings==13.4.4; sys_platform == 'linux'"]
bench = ["matplotlib>=3.8", "pandas>=2.1"]
# baselines: flashinfer-python, added and pinned together with the attention benchmarks.

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Copied from other projects and kept byte for byte; see each file's header.
extend-exclude = ["bench/baselines/vllm/swap_blocks_triton.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Verbatim tool output used as test input.
"tests/test_timer_check.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "bench", "scripts", "tests", "experiments"]
mypy_path = ["src", "."]
explicit_package_bases = true
exclude = ["bench/baselines/vllm/swap_blocks_triton\\.py"]

[[tool.mypy.overrides]]
module = ["triton", "triton.*", "matplotlib", "matplotlib.*", "cuda", "cuda.*"]
ignore_missing_imports = true

# Experiment kernels and their tests use Triton's untyped decorator and pytest fixtures.
[[tool.mypy.overrides]]
module = ["experiments.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["experiments.*.test_kernel"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# The copied vLLM kernel is not type-checked; see its header.
[[tool.mypy.overrides]]
module = ["bench.baselines.vllm.swap_blocks_triton"]
follow_imports = "skip"

# @triton.jit kernels use Triton's untyped decorator.
[[tool.mypy.overrides]]
module = ["kvkernels.ops.*"]
disallow_untyped_decorators = false

# Tests and @triton.jit kernels use Triton's untyped decorator.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "experiments"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["gpu: needs a CUDA GPU; skipped in CI and the devcontainer"]
