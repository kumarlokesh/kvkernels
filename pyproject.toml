[project]
name = "kvkernels"
version = "0.1.0"
description = "Triton kernels for paged KV-cache movement and shared-prefix decode attention"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Ranges, so the package installs next to an engine's own torch: torch 2.13 is the
# oldest torch of a supported engine release, and Triton 3.7 is what it requires.
# Triton publishes Linux wheels only.
dependencies = [
    "torch>=2.13",
    "triton>=3.7; sys_platform == 'linux'",
]

[project.optional-dependencies]
# The benchmark environment pins torch and Triton exactly, so that results stay
# comparable across runs. Pick exactly one torch build: cpu (devcontainer, CI, macOS)
# or a CUDA build (GPU machines).
cpu = ["torch==2.14.1", "triton==3.8.0; sys_platform == 'linux'"]
# cuda-bindings reaches the CUDA driver API for the batched-DMA benchmark baseline;
# its major version matches the torch build's CUDA.
cu126 = [
    "torch==2.14.1; sys_platform == 'linux'",
    "triton==3.8.0; sys_platform == 'linux'",
    "cuda-bindings==12.9.10; sys_platform == 'linux'",
]
cu130 = [
    "torch==2.14.1; sys_platform == 'linux'",
    "triton==3.8.0; sys_platform == 'linux'",
    "cuda-bindings==13.4.4; sys_platform == 'linux'",
]
bench = ["numpy>=1.26", "matplotlib>=3.8", "pandas>=2.1"]
# Benchmark baselines on GPU machines. FlashInfer compiles its kernels on first use,
# so the machine also needs the CUDA compiler.
baselines = ["flashinfer-python==0.7.2; sys_platform == 'linux'"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src", "integrations/vllm/src"]
# Copied from other projects and kept byte for byte; see each file's header.
extend-exclude = [
    "bench/baselines/vllm/swap_blocks_triton.py",
    "bench/baselines/vllm/triton_unified_attention.py",
    "bench/baselines/vllm/triton_attention_helpers.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Verbatim tool output used as test input.
"tests/test_timer_check.py" = ["E501"]
"tests/test_dram_bytes.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src",
    "bench",
    "scripts",
    "tests",
    "experiments",
    "examples",
    "integrations/vllm/src",
    "integrations/vllm/tests",
]
mypy_path = ["src", ".", "integrations/vllm/src"]
explicit_package_bases = true
exclude = [
    "bench/baselines/vllm/swap_blocks_triton\\.py",
    "bench/baselines/vllm/triton_unified_attention\\.py",
    "bench/baselines/vllm/triton_attention_helpers\\.py",
]

[[tool.mypy.overrides]]
module = [
    "triton",
    "triton.*",
    "matplotlib",
    "matplotlib.*",
    "cuda",
    "cuda.*",
    "flashinfer",
    "flashinfer.*",
    "vllm",
    "vllm.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

# The vLLM backend subclasses vLLM classes, which mypy sees as untyped where vLLM
# is not installed.
[[tool.mypy.overrides]]
module = ["kvkernels_vllm.backend"]
disallow_subclassing_any = false

# Experiment kernels and their tests use Triton's untyped decorator and pytest fixtures.
[[tool.mypy.overrides]]
module = ["experiments.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["experiments.*.test_kernel"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# The copied vLLM kernels are not type-checked; see each file's header.
[[tool.mypy.overrides]]
module = [
    "bench.baselines.vllm.swap_blocks_triton",
    "bench.baselines.vllm.triton_unified_attention",
    "bench.baselines.vllm.triton_attention_helpers",
]
follow_imports = "skip"

# @triton.jit kernels use Triton's untyped decorator.
[[tool.mypy.overrides]]
module = ["kvkernels.ops.*"]
disallow_untyped_decorators = false

# Tests and @triton.jit kernels use Triton's untyped decorator.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "experiments", "integrations/vllm/tests"]
pythonpath = [".", "integrations/vllm/src"]
addopts = "-ra --strict-markers"
markers = ["gpu: needs a CUDA GPU; skipped in CI and the devcontainer"]
