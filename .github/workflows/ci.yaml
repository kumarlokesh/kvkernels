name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it builds.
  workflow_call:

# CPU only, under the Triton interpreter. No benchmark jobs: published numbers come
# only from result JSON produced on GPU machines.
env:
  # uv run uses the environment uv sync built (see the Makefile).
  UV_NO_SYNC: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.12"
      - run: uv sync --locked --extra cpu --extra bench
      - run: make lint
      - name: README results tables match the committed result files
        run: uv run python scripts/readme_results.py --check

  # The versions in the lock file, on the Python the devcontainer uses.
  test:
    runs-on: ubuntu-latest
    env:
      TRITON_INTERPRET: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.12"
      - run: uv sync --locked --extra cpu --extra bench
      - run: make test

  # The lowest versions the package supports: torch 2.13.0, the Triton it requires,
  # and the lowest supported Python.
  test-oldest:
    runs-on: ubuntu-latest
    env:
      TRITON_INTERPRET: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.11"
      - run: make install-oldest
      - run: make test-oldest
