name: ci

on:
  push:
    branches: [main]
  pull_request:

# CPU only, under the Triton interpreter. No benchmark jobs: published numbers come
# only from result JSON produced on GPU machines.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.12"
      - run: uv sync --locked --extra cpu --extra bench
      - run: make lint

  test:
    runs-on: ubuntu-latest
    env:
      TRITON_INTERPRET: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.12"
      - run: uv sync --locked --extra cpu --extra bench
      - run: make test
